[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutana"
version = "0.3.2"
description = "High-performance Python tool for creating astronomical image cutouts"
readme = "README.md"
authors = [{ name = "European Space Agency", email = "pablo.gomez@esa.int" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "astropy>=5.0",
    "dotmap>=1.3",
    "drizzle>=2.0.1",
    "fitsbolt==0.3.0",
    "fsspec>=2023.1.0",
    "images-to-zarr>=0.3.5",
    "ipyfilechooser>=0.6",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.0",
    "loguru>=0.6",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pandas>=1.3",
    "portalocker>=2.0",
    "psutil>=5.8",
    "pyarrow>=14.0.0",
    "scikit-image>=0.21",
    "toml>=0.10",
]

[project.optional-dependencies]
ui = ["voila"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "vulture>=2.10",
    "playwright>=1.40",
    "tqdm>=4.60",
    "memory-profiler>=0.60",
]
all = ["cutana[ui,dev]"]

[project.urls]
Homepage = "https://github.com/ESA-Datalabs/cutana"
Repository = "https://github.com/ESA-Datalabs/cutana"
Issues = "https://github.com/ESA-Datalabs/cutana/issues"


[tool.setuptools.packages.find]
include = ["cutana*", "cutana_ui*", "assets"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cutana_ui = ["*.css", "*.js", "*.html", "*.md"]
assets = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=cutana",
    "--cov=cutana_ui",
    "--cov-report=term-missing",
    "-m",
    "not browser",               # Skip browser tests by default (run with -m browser)
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "ui: marks tests as UI tests (requires display)",
    "asyncio: marks tests as async (requires pytest-asyncio)",
    "browser: marks tests as browser e2e tests (requires Playwright + Voila)",
]


[tool.coverage.run]
source = ["cutana", "cutana_ui"]
omit = ["*/tests/*", "*/test_*.py", "setup.py"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc|\\.)?abstractmethod",
]

[tool.vulture]
min_confidence = 60
paths = ["cutana", "cutana_ui"]
exclude = ["tests/", "docs/", "examples/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    ".pytest_cache",
    ".vulture_whitelist.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLC0415"]
ignore = ["E203", "E501", "E721", "W293", "W291", "F541", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
"paper_scripts/**" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["cutana", "cutana_ui"]
force-single-line = false
combine-as-imports = true
