name: Running tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Search for severe code errors with ruff
        run: uvx ruff check . --select=E9,F63,F7,F82 --output-format=full
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Generate test data
        run: |
          cd tests/test_data
          uv run python generate_test_data.py
      - name: Test with pytest
        run: |
          set -e
          set -o pipefail
          uv run pytest -n auto -m "not browser and not slow" --durations=20 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report="term-missing:skip-covered" --cov=cutana --cov=cutana_ui tests/ | tee pytest-coverage.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: |
            pytest-coverage.txt
            coverage.xml
            pytest.xml

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --all-extras
      - name: Generate test data
        timeout-minutes: 3
        run: |
          cd tests/test_data
          uv run python generate_test_data.py
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright chromium
        timeout-minutes: 7
        run: uv run playwright install chromium --with-deps
      - name: Browser tests (fast)
        timeout-minutes: 12
        run: |
          set -e
          set -o pipefail
          uv run pytest -m "browser and not slow" tests/browser/ -v --timeout=120 --junitxml=pytest-browser.xml | tee pytest-browser-output.txt
      - name: Collect subprocess coverage
        if: always()
        run: |
          uv run coverage combine || true
          uv run coverage xml -o coverage-browser.xml || true
          uv run coverage report --skip-covered --format=text | tee pytest-browser-coverage.txt || true
      - name: Upload browser artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            pytest-browser-coverage.txt
            coverage-browser.xml
            pytest-browser.xml
      - name: Upload failure videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-videos
          path: /tmp/pytest-*/pytest-*/test_*/videos/
          retention-days: 7

  coverage-report:
    needs: [build, browser]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-results
          path: build-results
      - name: Download browser artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-results
          path: browser-results
        continue-on-error: true
      - name: Merge coverage
        run: python3 scripts/merge_coverage_xml.py
      - name: Merge JUnit XML
        run: python3 scripts/merge_junit_xml.py
      - name: Pytest coverage comment
        # Pinned: tracking @main meant an action release could silently change what
        # the badge measures, which is exactly what happened. Between 2026-07-02 and
        # 2026-07-08 the badge went from the merged build+browser figure to the
        # build-only one, making coverage look like it had dropped ~3 points when it
        # had not.
        uses: MishaKav/pytest-coverage-comment@v1.10.0
        with:
          # Only the merged XML is passed. The job used to supply pytest-coverage-path
          # as well, but the action documents the two inputs as alternatives and
          # defines no precedence, so the badge silently followed whichever the action
          # happened to prefer. The text file was a plain concatenation whose first
          # TOTAL is build-only, so whenever it won, browser coverage vanished from
          # the badge. combined-coverage.xml genuinely merges both jobs
          # (scripts/merge_coverage_xml.py), so it is now the single source.
          pytest-xml-coverage-path: ./combined-coverage.xml
          title: Coverage Report (build + browser)
          badge-title: Overall Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false
          xml-skip-covered: true
          remove-links-to-lines: true
          junitxml-path: ./combined-pytest.xml
